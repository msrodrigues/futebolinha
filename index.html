<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Futebolinha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Campeonato Brasileiro de Futebolinha</title>
<style>
  :root { --bg:#2fb350; --card:#fff; --tx:#12301c; --mut:#5d7a66; --bd:#cfe6d5; --ac:#0a5fe0; --hl:#fff3a8; --dg:#d62f1f; --ink:#0d3b1e; --az:#0a3d91; --am:#ffd400; }
  * { box-sizing:border-box }
  body { margin:0; font:16px/1.4 ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif; font-weight:600; color:var(--tx); padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    background:repeating-linear-gradient(90deg,#33bb56 0 56px,#2aa84b 56px 112px) fixed; }
  .pagina { max-width:780px; margin-inline:auto }
  /* título */
  header { text-align:center; background:var(--am); border:4px solid var(--ink); border-radius:26px; box-shadow:0 7px 0 var(--ink); padding:14px 10px 12px; margin:6px 0 22px; position:relative; overflow:hidden }
  header:before, header:after { content:"⚽"; position:absolute; font-size:44px; top:50%; transform:translateY(-50%) rotate(-15deg) }
  header:before { left:12px } header:after { right:12px; transform:translateY(-50%) rotate(20deg) }
  h1 { margin:0; line-height:1; color:var(--az) }
  h1 small { display:block; font-size:clamp(13px,3.6vw,19px); font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink) }
  h1 b { display:block; font-size:clamp(32px,10vw,60px); font-weight:900; letter-spacing:.02em; text-transform:uppercase; color:#fff; -webkit-text-stroke:2px var(--az); paint-order:stroke fill; text-shadow:3px 4px 0 var(--az) }
  h2 { display:inline-block; font-size:17px; font-weight:900; margin:20px 0 10px; padding:5px 16px; background:#fff; color:var(--az); border:3px solid var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--ink); transform:rotate(-1.5deg) }
  .card { background:var(--card); border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); padding:10px; overflow-x:auto; margin-bottom:14px }
  table { border-collapse:separate; border-spacing:0; width:100% }
  th,td { padding:9px 6px; text-align:center; white-space:nowrap }
  th { background:var(--az); color:#fff; font-weight:800; font-size:13px }
  th:first-child { border-radius:12px 0 0 12px } th:last-child { border-radius:0 12px 12px 0 }
  td.nome, th.nome { text-align:left }
  tbody td { border-bottom:2px dashed var(--bd) }
  tr.lider td { background:var(--hl); font-weight:900 }
  tr.saiu td { opacity:.45 }
  tr.lib td { background:#e4f0ff } tr.reb td { background:#ffe6e3 }
  tr.lib.lider td { background:var(--hl) }
  tr.lib td:first-child { box-shadow:inset 6px 0 0 #1e6fd9 }
  tr.reb td:first-child { box-shadow:inset 6px 0 0 #d93025 }
  td:first-child { font-size:18px }
  td.pts { font-weight:900; font-size:18px; color:var(--az) }
  .leg { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:14px; font-weight:800; padding:10px 14px; background:rgba(255,255,255,.95); border:3px solid var(--ink); border-radius:16px }
  .leg i { display:inline-block; width:14px; height:14px; border-radius:5px; margin-right:5px; vertical-align:-2px }
  .leg input { width:54px; padding:4px; font:inherit; font-weight:900; color:var(--tx); background:#fff; border:3px solid var(--az); border-radius:10px; text-align:center }
  .tn { display:inline-flex; align-items:center; gap:7px; vertical-align:middle; font-weight:800 }
  .jogo { display:grid; grid-template-columns:1fr 54px 16px 54px 1fr; gap:6px; align-items:center; padding:8px 4px 4px }
  .partida { padding-bottom:6px }
  .partida+.partida, .folga { border-top:2px dashed var(--bd) }
  .jogo .c { text-align:right } .jogo .f { text-align:left } .jogo .x { text-align:center; color:var(--mut); font-weight:900 }
  .jogo .c .tn { flex-direction:row-reverse }
  .partida.anulado { opacity:.4; text-decoration:line-through }
  .folga { color:var(--mut); font-size:14px; padding:8px 4px 2px }
  .ao-vivo { font-size:12px; color:#d62f1f; margin-left:6px; animation:pisca 1.4s infinite }
  @keyframes pisca { 50% { opacity:.3 } }
  .timer { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:2px 4px 0; padding:6px 8px; background:#f3f9ff; border:2px solid var(--bd); border-radius:14px }
  .timer button { padding:4px 10px; min-height:34px !important; border-width:2px; box-shadow:0 2px 0 var(--ink); font-size:15px }
  .timer button.mini { font-size:12px; padding:4px 7px }
  .tt { font-size:20px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--az); min-width:56px; text-align:center }
  .tbar { flex:1 1 120px; height:14px; background:#dfe8f5; border:2px solid var(--ink); border-radius:999px; overflow:hidden }
  .tbar i { display:block; height:100%; width:100%; background:#2fb350; border-radius:999px; transition:width .1s linear, background .3s }
  .timer.warn .tbar i { background:#ffb000 } .timer.warn .tt { color:#c27a00 }
  .timer.crit .tbar i { background:#e02b20 } .timer.crit .tt { color:#d62f1f; animation:pisca .6s infinite }
  .timer.fim .tt { color:#d62f1f } .timer.fim:after { content:"🏁 Fim de jogo!"; font-weight:900; color:var(--ink); font-size:14px }
  .cfg input { width:64px }
  input[type=text] { width:54px; padding:7px 2px; text-align:center; font:inherit; font-size:20px; font-weight:900; color:var(--az); background:#fff; border:3px solid var(--az); border-radius:12px }
  input[type=text]:focus { outline:none; border-color:#ff7a00; box-shadow:0 0 0 3px #ffd9b0 }
  input[type=text]:disabled { background:#eef3ff; opacity:.8 }
  .rodcab { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 6px 10px; margin:-10px -10px 4px; background:#e9f6ff; border-bottom:3px solid var(--ink); border-radius:16px 16px 0 0; padding:10px 14px }
  .ok { color:#0a8f3c; font-weight:900; font-size:14px }
  .rod, .mut { color:var(--mut); font-size:13px }
  body > .pagina > p.rod { color:#fff; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.45); font-size:14px }
  #corpo p.rod { color:#fff; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.45) }
  button, select { font:inherit; font-weight:800; padding:8px 14px; border-radius:14px; border:3px solid var(--ink); background:#fff; color:var(--tx); cursor:pointer; box-shadow:0 3px 0 var(--ink) }
  button:active { transform:translateY(3px); box-shadow:none }
  button:disabled { opacity:.5; cursor:not-allowed }
  button.pri { background:#ff7a00; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.25) }
  button.dg { color:var(--dg) }
  select { max-width:100%; box-shadow:none }
  .lin { display:flex; align-items:center; gap:6px; padding:8px 4px; flex-wrap:nowrap }
  .lin svg, .lin > span { flex:none }
  .lin .tbtn { flex:1 1 0; min-width:0; padding:8px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; background:#fff7cc }
  .lin button { flex:none; padding:8px 10px; white-space:nowrap }
  .lin+.lin { border-top:2px dashed var(--bd) }
  .lin input.nm { flex:1 1 0; min-width:0; width:auto; text-align:left; padding:8px 10px; font-size:16px }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:#fff; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.4) }
  .bar button { text-shadow:none }
  .bar label { display:inline-flex; align-items:center; gap:6px }
  button, select, input:not([type=checkbox]) { touch-action:manipulation; min-height:40px }
  @media (min-width:900px) { .pagina { max-width:960px } body { font-size:17px } }
  /* seletor de time */
  #seletor { position:fixed; inset:0; z-index:50; background:rgba(8,40,18,.7); display:flex; align-items:flex-end; justify-content:center }
  #seletor[hidden] { display:none }
  .sel { background:#f1fff4; width:100%; max-width:900px; height:92vh; border:4px solid var(--ink); border-bottom:0; border-radius:24px 24px 0 0; display:flex; flex-direction:column; overflow:hidden }
  @media (min-width:700px) { #seletor { align-items:center } .sel { height:86vh; border-bottom:4px solid var(--ink); border-radius:24px } }
  .sel-top { background:var(--am); border-bottom:4px solid var(--ink); padding:10px 12px; display:flex; flex-direction:column; gap:8px }
  .sel-tit { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:900; color:var(--az); font-size:18px }
  .sel-top input { width:100%; text-align:left; font-size:16px; padding:8px 12px; border-radius:999px }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:thin }
  .chip { flex:none; padding:6px 12px; font-size:14px; border-radius:999px; box-shadow:0 2px 0 var(--ink); min-height:0 !important }
  .chip.on { background:var(--az); color:#fff }
  .grade { flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; align-content:start }
  .tcard { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 6px 8px; min-height:112px; background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 3px 0 var(--ink); text-align:center; font-size:13px; line-height:1.15 }
  .tcard span.n { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .tcard:disabled { opacity:.45; box-shadow:none }
  .tcard .dono { font-size:11px; color:var(--dg); font-weight:800 }
  .tcard.atual { background:var(--hl); border-color:#ff7a00 }
  .vazio { grid-column:1/-1; text-align:center; color:var(--mut); padding:30px 10px }
  /* cartão de jogo */
  .jogos { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:10px; padding:4px 2px }
  .partida { padding:8px 10px 8px; border:3px solid var(--bd); border-radius:16px; background:#fff; cursor:pointer; transition:border-color .15s }
  .partida+.partida { border-top:3px solid var(--bd) }
  .partida.foco { border-color:#ff7a00; box-shadow:0 0 0 3px #ffe1c2 }
  .lado { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:3px 0 }
  .lado + .lado { border-top:1px dashed var(--bd) }
  .lado.lidera .tn { color:var(--az); text-decoration:underline; text-decoration-color:#ffd400; text-decoration-thickness:3px; text-underline-offset:3px }
  .stp { display:flex; align-items:center; gap:4px; flex:none }
  .stp button { width:32px; height:32px; min-height:32px !important; padding:0; border-radius:50%; font-size:18px; line-height:1; border-width:2px; box-shadow:0 2px 0 var(--ink); background:#eef3fb; color:var(--az) }
  .stp button.mais { background:#d9f5e1; color:#0a7a35 }
  .stp output { min-width:30px; text-align:center; font-size:24px; font-weight:900; color:var(--az) }
  .partida .timer { display:none; margin:8px 0 0 }
  .partida.foco .timer { display:flex }
  .timer .tbar { height:10px; order:5; flex:1 1 100% }
  .timer { padding:6px 8px }
  .pen { margin-top:8px; padding:8px; background:#fff7cc; border:2px dashed #e0b800; border-radius:12px }
  .pen-t { font-weight:900; font-size:14px; color:var(--az); margin-bottom:2px }
  .pen-d { font-size:12px; color:var(--dg); margin-top:4px }
  .rodcab .ok { min-width:70px; text-align:right }
  .mut2 { font-weight:600; font-size:12px; opacity:.9 }
  /* modos */
  .modos { display:flex; gap:10px; flex-wrap:wrap; width:100% }
  .modo { flex:1 1 220px; text-align:left; padding:10px 14px; border-radius:16px; font-size:17px; opacity:.85 }
  .modo small { display:block; font-size:12px; font-weight:600; color:var(--mut) }
  .modo.on { background:var(--az); color:#fff; opacity:1 } .modo.on small { color:#cfe0ff }
  /* chaveamento */
  .chave { display:flex; gap:14px; overflow-x:auto; padding:6px 4px 12px; margin:0 -4px }
  .col { flex:0 0 190px; display:flex; flex-direction:column }
  .colh { text-align:center; font-weight:900; font-size:13px; color:#fff; background:var(--az); border:3px solid var(--ink); border-radius:999px; padding:3px 8px; margin-bottom:8px }
  .colj { flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:10px }
  .mcard { background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); overflow:hidden }
  .mcard.jog { cursor:pointer } .mcard.foco { border-color:#ff7a00; box-shadow:0 0 0 3px #ffe1c2, 0 3px 0 var(--ink) }
  .ml { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:6px 8px; font-size:14px; font-weight:800 }
  .ml+.ml { border-top:2px dashed var(--bd) }
  .ml.pend { color:var(--mut); font-weight:600; font-size:12px; font-style:italic }
  .ml.venc { background:var(--hl) } .ml b { font-size:18px; color:var(--az) } .ml small { font-size:11px; color:var(--dg) }
  .painel { background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); padding:10px; margin-top:6px }
  .painel-t { font-weight:900; color:var(--az); margin-bottom:6px }
  .campeao { text-align:center; font-size:22px; font-weight:900; color:var(--az); background:var(--am); border:4px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); padding:12px; margin-bottom:12px; animation:pula 1.2s ease-in-out infinite }
  @keyframes pula { 50% { transform:scale(1.03) } }
  .gtit { font-weight:900; color:#fff; background:var(--az); display:inline-block; padding:2px 14px; border-radius:999px; margin:0 0 6px 2px }
  .gtag { font-size:11px; font-weight:900; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px }
  tr.cls td { background:#e8f8ec } tr.cls td:first-child { box-shadow:inset 6px 0 0 #2fb350 }
  .bar input[type=number] { width:66px; padding:6px; font:inherit; font-weight:900; color:var(--tx); background:#fff; border:3px solid var(--az); border-radius:10px; text-align:center }
</style>
</head>
<body>
<div class="pagina">
<header><h1><small>Campeonato Brasileiro de</small><b>Futebolinha</b></h1></header>

<h2>👥 Os craques</h2>
<div class="card" id="jog"></div>
<div class="bar" id="acoes"></div>

<div id="corpo"></div>

<h2>📦 Levar para outro aparelho</h2>
<div class="bar">
  <button id="exp">📤 Salvar uma cópia</button>
  <button id="imp">📥 Abrir uma cópia</button>
  <input type="file" id="arq" accept=".json" hidden>
</div>
<p class="rod">O campeonato já fica salvo sozinho neste aparelho. Para jogar em outro celular ou tablet, toque em "Salvar uma cópia" (vira um arquivo) e, no outro aparelho, em "Abrir uma cópia".</p>

</div>
<div id="seletor" hidden>
  <div class="sel" role="dialog" aria-modal="true" aria-labelledby="selTit">
    <div class="sel-top">
      <div class="sel-tit"><span id="selTit">Escolha o time</span><button id="selFechar" aria-label="Fechar">✕</button></div>
      <input type="text" id="selBusca" placeholder="🔍 Buscar time ou seleção" autocomplete="off">
      <div class="chips" id="selChips"></div>
    </div>
    <div class="grade" id="selGrade"></div>
  </div>
</div>
<script src="times.js"></script>
<script>
const KEY = 'campeonato-pc-v2';
const novo = () => ({ players: [], started: false, volta: true, rounds: [], scores: {}, saved: {}, next: 1, dur: 180, tm: {}, mudo: false, modo: 'liga', foco: null, pens: {}, chave: [], grupos: [], nGrupos: null, nClass: null });
let S = JSON.parse(localStorage.getItem(KEY) || 'null') || novo();
function normalizar() {
  S.dur ||= 180; S.tm ||= {}; S.pens ||= {}; S.chave ||= []; S.grupos ||= []; S.modo ||= 'liga'; S.foco ??= null;
  (S.rounds || []).forEach(r => { if (r.lbl === 'Returno') r.v = true; });
}
normalizar();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const P = id => S.players.find(p => p.id === id);
const salvar = () => localStorage.setItem(KEY, JSON.stringify(S));

function corTime(t) {
  if (!t || t[2]) return t;
  let h = 0; for (const c of t[0]) h = (h * 31 + c.charCodeAt(0)) % 360;
  return [t[0], t[1], `hsl(${h} 45% 38%)`, '#fff', t[4], t[5], t[6]];
}
function escudo(ti, s = 26, lazy = false) {
  const t = corTime(TIMES[ti]);
  if (!t) return `<svg width="${s}" height="${s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#999" stroke-dasharray="3 3" stroke-width="2"/><text x="20" y="25" text-anchor="middle" font-size="14" fill="#999" font-family="system-ui">?</text></svg>`;
  // Usa escudos/SIGLA.png (ex.: escudos/FLA.png) se existir; senão, o escudo desenhado
  const svg = `<svg width="${s}" height="${s}" viewBox="0 0 40 40" role="img" aria-label="${esc(t[0])}"><circle cx="20" cy="20" r="17.5" fill="${t[2]}" stroke="${t[3]}" stroke-width="3"/><text x="20" y="24.5" text-anchor="middle" font-size="${t[1].length > 2 ? 11 : 13}" font-weight="800" fill="${t[3]}" font-family="system-ui,sans-serif">${t[1]}</text></svg>`;
  return `<span style="display:inline-flex;width:${s}px;height:${s}px;position:relative">${svg}<img src="escudos/${t[5]}.png" ${lazy ? 'loading="lazy"' : ''} alt="${esc(t[0])}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:${t[4] === 'WC' ? 'cover;border-radius:50%' : 'contain'}" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"></span>`;
}
const tag = id => { const p = P(id); return p ? `<span class="tn">${escudo(p.team, 22)}<span>${esc(p.name)}</span></span>` : '?'; };

// Método do círculo; ímpar → folga
function gerar(ids, volta) {
  const arr = [...ids]; if (arr.length % 2) arr.push(null);
  const n = arr.length, turno = [];
  for (let r = 0; r < n - 1; r++) {
    const jogos = []; let folga = null;
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      if (a === null) folga = b; else if (b === null) folga = a;
      else jogos.push(r % 2 ? [b, a] : [a, b]);
    }
    turno.push({ jogos, folga });
    arr.splice(1, 0, arr.pop());
  }
  turno.forEach(t => t.lbl = 'Turno');
  return volta ? [...turno, ...turno.map(t => ({ lbl: 'Returno', v: true, folga: t.folga, jogos: t.jogos.map(([a, b]) => [b, a]) }))] : turno;
}

// Jogador que entra no meio: joga contra cada adversário em rodadas extras no fim do calendário
function rodadasExtras(novoId) {
  const adv = S.players.filter(p => p.id !== novoId && !p.out);
  const lbl = 'Entrada de ' + P(novoId).name;
  const ida = adv.map((o, i) => ({ lbl, folga: null, jogos: [i % 2 ? [o.id, novoId] : [novoId, o.id]] }));
  return S.volta ? [...ida, ...ida.map(r => ({ lbl, v: true, folga: null, jogos: [[r.jogos[0][1], r.jogos[0][0]]] }))] : ida;
}

function classificar(ids) {
  const base = ids ? S.players.filter(p => ids.includes(p.id)) : S.players;
  const t = Object.fromEntries(base.map(p => [p.id, { id: p.id, out: p.out, J:0, V:0, E:0, D:0, GP:0, GC:0 }]));
  S.rounds.forEach((r, ri) => {
    r.jogos.forEach(([a, b], ji) => {
      if (!t[a] || !t[b] || P(a).out || P(b).out) return;
      const v = S.scores[ri + '-' + ji]; if (!v || v[0] === '' || v[1] === '') return;
      const x = +v[0], y = +v[1];
      t[a].J++; t[b].J++; t[a].GP += x; t[a].GC += y; t[b].GP += y; t[b].GC += x;
      if (x > y) { t[a].V++; t[b].D++; } else if (x < y) { t[b].V++; t[a].D++; } else { t[a].E++; t[b].E++; }
    });
  });
  const nm = o => P(o.id).name;
  return Object.values(t).map(o => ({ ...o, SG: o.GP - o.GC, P: o.V * 3 + o.E }))
    .sort((a, b) => a.out - b.out || b.P - a.P || b.V - a.V || b.SG - a.SG || b.GP - a.GP || nm(a).localeCompare(nm(b)));
}

function desenharJogadores() {
  $('jog').innerHTML = S.players.length ? S.players.map(p => `
    <div class="lin" style="${p.out ? 'opacity:.5' : ''}">
      ${escudo(p.team, 30)}

// Tamanho das zonas: padrão ≈ 1/5 dos jogadores (20 → 4), ajustável; nunca se sobrepõem

  try {
    if (on && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
    if (!on && wake) { await wake.release(); wake = null; }
  } catch {}
}
const rodando = () => Object.keys(S.tm).filter(k => S.tm[k].end);
function pausar(k) { const t = tinfo(k); if (t.end) { t.rest = resta(k); t.end = null; } atualizarTimer(k); }
function pararTodos() { rodando().forEach(pausar); wakeLigar(false); }

function timerAcao(k, acao) {
  const t = tinfo(k);
  if (acao === 'play') {
    if (t.end) pausar(k);
    else {
      if (t.rest <= 0) t.rest = t.dur = S.dur;
      rodando().forEach(pausar);
      t.end = Date.now() + t.rest * 1000; RT[k] = { a30: t.rest <= 30, nx: 0 };
      if (k.startsWith('m-')) S.foco = k; else focar(k);
      if (!iniciado(k)) S.scores[k] = [0, 0];
      refrescar(k);
      tom(1, .01, .0001); wakeLigar(true);    // destrava o áudio no gesto do usuário
    }
  } else if (acao === 'reset') { t.end = null; t.rest = t.dur = S.dur; delete RT[k]; }
  else {
    const d = acao === '+10' ? 10 : -10;
    if (t.end) { t.end = Math.max(Date.now() + 1, t.end + d * 1000); RT[k] = { a30: resta(k) <= 30, nx: 0 }; }
    else { t.rest = Math.max(0, t.rest + d); t.dur = Math.max(t.dur, t.rest); }
  }
  salvar(); atualizarTimer(k);
}
function refrescar(k) {
  if (k.startsWith('m-')) return atualizarMata();
  if (sincronizarCopa()) { salvar(); return desenharCorpo(); }
  sincPlacar(k); atualizarTabela(); atualizarSelo(k);
}
function sincPlacar(k) {
  const [x, y] = placar(S.scores[k]);
  document.querySelectorAll(`.partida[data-k="${k}"] > .lado output`).forEach((o, i) => o.textContent = i ? y : x);
}
setInterval(() => {
  const ks = rodando(); if (!ks.length) { if (wake) wakeLigar(false); return; }
  const agora = Date.now();
  ks.forEach(k => {
    const t = S.tm[k], r = resta(k); RT[k] = RT[k] || { a30: r <= 30, nx: 0 };
    if (r <= 0) {
      const velho = agora - t.end > 3000; t.end = null; t.rest = 0; delete RT[k]; salvar();
      if (!velho) apitoFinal();
    } else {
      if (!RT[k].a30 && r <= 30) { RT[k].a30 = true; apitinho(); }
      if (r <= 15 && agora >= RT[k].nx) { clique(); RT[k].nx = agora + (0.1 + 0.9 * Math.pow(r / 15, 1.4)) * 1000; }
    }
    atualizarTimer(k);
  });
}, 50);

function tudo() { sincronizarCopa(); salvar(); desenharJogadores(); desenharCorpo(); }

// ---- eventos ----
$('jog').addEventListener('change', e => {
  const el = e.target, id = +el.dataset.id; if (!el.dataset.f) return;
  const p = P(id);
  if (el.dataset.f === 'name') p.name = el.value.trim() || p.name;
  tudo();
});
$('jog').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'add') return adicionar();
  const id = +b.dataset.id, p = P(id), f = b.dataset.f;
  if (f === 'pick') return abrirSeletor(id);
  if (f === 'del') S.players = S.players.filter(x => x.id !== id);
  else if (f === 'sair') {
    if (!confirm(S.modo !== 'liga' ? `Tirar ${p.name} do torneio?\n\nOs jogos dele(a) na fase de grupos ficam anulados e, no mata-mata, o adversário avança sem jogar (W.O.). Dá para reativar depois.` : `Remover ${p.name} do campeonato?\n\nOs jogos dele(a) ficam anulados e saem da tabela. Dá para reativar depois.`)) return;
    p.out = true;
  } else if (f === 'volta') p.out = false;
  tudo();
});
$('jog').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'novoNome') adicionar(); });
function adicionar() {
  const nome = $('novoNome').value.trim(); if (!nome) return;
  if (S.started && S.modo !== 'liga') return alert('Neste formato não dá para entrar jogador depois que o campeonato começou. Comece um campeonato novo para incluir mais gente.');
  const p = { id: S.next++, name: nome, team: null, out: false };
  S.players.push(p);
  if (S.started) S.rounds.push(...rodadasExtras(p.id));
  tudo(); $('novoNome').focus();
}

$('acoes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.modo) { S.modo = b.dataset.modo; return tudo(); }
  if (b.id === 'sortear') { S.players.sort(() => Math.random() - .5); tudo(); }
  if (b.id === 'iniciar') {
    S.scores = {}; S.pens = {}; S.tm = {}; S.foco = null; S.started = true;
    S.chave = []; S.grupos = [];
    if (S.modo === 'mata') { S.chave = chaveSeeds(S.players.map(p => p.id)); S.rounds = []; }
    else if (S.modo === 'copa') { S.grupos = distribuir(S.players.map(p => p.id), copaCfg().G); S.rounds = gerarCopa(S.grupos, S.volta); }
    else S.rounds = gerar(S.players.map(p => p.id), S.volta);
    tudo();
  }
  if (b.id === 'reiniciar' && confirm('Começar um campeonato novo? Os placares e o calendário serão apagados (os jogadores ficam).')) {
    pararTodos(); S = { ...novo(), players: S.players.map(p => ({ ...p, out: false })), next: S.next, volta: S.volta, dur: S.dur, mudo: S.mudo, modo: S.modo }; tudo();
  }
});
$('acoes').addEventListener('change', e => {
  if (e.target.id === 'nGrp' || e.target.id === 'nCls') { S[e.target.id === 'nGrp' ? 'nGrupos' : 'nClass'] = Math.max(1, parseInt(e.target.value) || 1); return tudo(); }
  if (e.target.id !== 'volta') return;
  if (S.started) ajustarVolta(e.target.checked); else { S.volta = e.target.checked; salvar(); }
});

$('corpo').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.z) { S[el.dataset.z] = Math.max(0, parseInt(el.value) || 0); return tudo(); }
  if (el.id === 'durMin') {
    const sg = Math.max(30, Math.round((parseFloat(String(el.value).replace(',', '.')) || 3) * 60));
    S.dur = sg; Object.values(S.tm).forEach(t => { if (!t.end && t.rest === t.dur) t.rest = t.dur = sg; });
    el.value = sg / 60; salvar(); atualizarTimers();
  }
});
function mudarPlacar(b) {
  const k = b.dataset.g, sd = +b.dataset.s, pen = !!b.dataset.p, mata = k.startsWith('m-');
  const r = mata ? +k.split('-')[1] : 0, i = mata ? +k.split('-')[2] : 0, w0 = mata ? venc(r, i) : null;
  const alvo = pen ? S.pens : S.scores, v = placar(alvo[k]);
  v[sd] = Math.max(0, Math.min(99, v[sd] + +b.dataset.d)); alvo[k] = v;
  if (!pen && v[0] !== v[1]) delete S.pens[k];
  if (mata) { if (venc(r, i) !== w0) limparAdiante(r + 1, i >> 1); salvar(); atualizarMata(); }
  else { if (sincronizarCopa()) { salvar(); return desenharCorpo(); } salvar(); sincPlacar(k); atualizarTabela(); atualizarSelo(k); }
}
function atualizarSelo(k) { const ri = parseInt(k), el = document.querySelector(`[data-rb="${ri}"]`); if (el) el.textContent = selo(ri); }
$('corpo').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) {
    if (b.id === 'mudo') { S.mudo = !S.mudo; b.textContent = S.mudo ? '🔇 Sem som' : '🔊 Com som'; return salvar(); }
    if (b.dataset.g) return mudarPlacar(b);
    if (b.dataset.tm) return timerAcao(b.closest('.timer').dataset.t, b.dataset.tm);
    return;
  }
  const mc = e.target.closest('.mcard.jog');
  if (mc) { S.foco = mc.dataset.m; document.querySelectorAll('.partida.foco').forEach(e => e.classList.remove('foco')); salvar(); return atualizarMata(); }
  const pt = e.target.closest('.partida'); if (pt && !pt.closest('.painel')) focar(pt.dataset.k);
});

// Cópia do campeonato (arquivo) para levar a outro aparelho
$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
  a.download = 'meu-campeonato-futebolinha.json'; a.click();
};
$('imp').onclick = () => $('arq').click();
$('arq').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.players)) throw 0;
    pararTodos(); S = { ...novo(), ...d }; normalizar(); tudo();
  } catch { alert('Não consegui abrir esse arquivo. Ele precisa ser uma cópia salva pelo Futebolinha.'); }
  e.target.value = '';
};


// ---- seletor de time ----
const semAcento = x => x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
let SEL = { id: null, grupo: 'A', q: '' };
function abrirSeletor(id) {
  const p = P(id); SEL = { id, grupo: p.team !== null && TIMES[p.team] ? TIMES[p.team][4] : SEL.grupo, q: '' };
  $('selTit').textContent = 'Time de ' + p.name; $('selBusca').value = '';
  $('seletor').hidden = false; document.body.style.overflow = 'hidden'; desenharSeletor();
}
function fecharSeletor() { $('seletor').hidden = true; document.body.style.overflow = ''; }
function desenharSeletor() {
  $('selChips').innerHTML = GRUPOS.map(([g, nome]) => `<button class="chip ${!SEL.q && g === SEL.grupo ? 'on' : ''}" data-g="${g}">${nome}</button>`).join('');
  const dono = {}; S.players.forEach(x => { if (x.team !== null) dono[x.team] = x; });
  const q = semAcento(SEL.q.trim());
  const itens = TIMES.map((t, i) => [t, i]).filter(([t]) => q ? semAcento(t[0]).includes(q) : t[4] === SEL.grupo);
  const atual = P(SEL.id).team;
  $('selGrade').innerHTML = (q ? '' : `<button class="tcard" data-t="">${escudo(null, 44)}<span class="n">Sem time</span></button>`) +
    (itens.length ? itens.map(([t, i]) => {
      const d = dono[i], ocupado = d && d.id !== SEL.id;
      return `<button class="tcard ${i === atual ? 'atual' : ''}" data-t="${i}" ${ocupado ? 'disabled' : ''}>${escudo(i, 44, true)}<span class="n">${esc(t[0])}</span>${ocupado ? `<span class="dono">${esc(d.name)}</span>` : ''}</button>`;
    }).join('') : '<div class="vazio">Nenhum time encontrado 😕</div>');
}
$('selChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; SEL.grupo = b.dataset.g; SEL.q = ''; $('selBusca').value = ''; desenharSeletor(); $('selGrade').scrollTop = 0; });
$('selBusca').addEventListener('input', e => { SEL.q = e.target.value; desenharSeletor(); });
$('selGrade').addEventListener('click', e => {
  const b = e.target.closest('.tcard'); if (!b || b.disabled) return;
  P(SEL.id).team = b.dataset.t === '' ? null : +b.dataset.t; fecharSeletor(); tudo();
});
$('selFechar').onclick = fecharSeletor;
$('seletor').addEventListener('click', e => { if (e.target === $('seletor')) fecharSeletor(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('seletor').hidden) fecharSeletor(); });

tudo();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
